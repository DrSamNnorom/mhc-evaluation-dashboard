<!DOCTYPE html>
<!--
  ===========================================================================
  Mobile Care Dashboard - composite build
  ===========================================================================
  ONE FILE, TWO STATES.

    State 1, this document      the lock screen you are reading the source of
    State 2, after the password the whole dashboard, decrypted in the browser

  The dashboard is in here, as one base64 AES-256-GCM ciphertext near the
  bottom of this file. Without the password there is nothing in this file to
  read: no figures, no site names, no page text, no structure. With it, the
  browser decrypts locally and replaces this document with that one, in this
  tab, with no request to anything.

  HOW THIS FILE IS BUILT

    python3 etl/build_db.py          submissions  ->  db/mhc.db
    python3 etl/export_dashboard.py  warehouse    ->  outputs/dashboard_data.json
    python3 etl/render_hybrid.py     payload      ->  MHC_Evaluation_Report.html
    python3 etl/lock_report.py       that report  ->  this file

  WHERE THE COMMENTS ARE
    The lock screen is commented in place, below, in four steps.
    The dashboard's own code is commented at its source, which is
    dashboard/hybrid/template.html (layout, tokens, print rules),
    charts.js (the SVG chart layer) and app.js (data, state, sections).
    A readable skeleton of this whole architecture, meant to be copied by
    another team, is outputs/MHC_Composite_Template.html.

  REUSING IT
    Nothing in the lock screen knows what programme it is guarding. Point
    SRC at a different built report, change the GATE_* constants in
    etl/lock_report.py, swap the two logo files, and rebuild.

  NOT ACCESS CONTROL. Anyone with the password, or with an unlocked copy
  saved from an open session, has the contents. Changing who can read it
  means changing the password and reissuing the file.
  ===========================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mom &amp; Baby Mobile Health Centers</title>
<style>
/* One centered column, nothing else. The gate says four things: whose report
   this is (the mark), what it is (Restricted Report), what to do (Enter
   Password, Open the Dashboard), and how it is protected (Password Encrypted
   Report). Everything the password protects stays on the other side of the
   password, so nothing here names a site, a figure or a finding. */
:root {
  --brand: #7029EC; --violet: #440099; --ink: #16202B; --sub: #5B6675;
  --line: #D9DEE5; --bg: #F7F9FB; --surface: #FFFFFF; --errc: #440099;
  /* The quiet text token. It has to clear 4.5:1 on the card in both
     themes, because the welcome line and the field's own label are
     written in it. */
  --mute: #5B6675;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0E141B; --surface: #141C25; --line: #26313E;
          --ink: #EEF2F7; --sub: #A8B4C2; --mute: #828F9C; --errc: #6179FF;
          --brand: #A97FF4; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Graphik", "Graphik Web", Arial, "Helvetica Neue", Helvetica, sans-serif;
  background: var(--bg); color: var(--ink);
  display: grid; place-items: center; min-height: 100vh;
  padding: 24px; position: relative; overflow: hidden;
}
/* A soft brand wash and the national outline, held far back. */
body::before {
  content: ""; position: fixed; inset: -30% -20% auto;  height: 75%;
  background: radial-gradient(58% 62% at 50% 18%,
    color-mix(in srgb, #7029EC 9%, transparent), transparent 70%);
  pointer-events: none;
}
svg.us {
  position: fixed; left: 50%; bottom: -12%; transform: translateX(-50%);
  width: min(1040px, 125vw); height: auto; opacity: .085;
  pointer-events: none;
}
svg.us path { fill: none; stroke: var(--brand); stroke-width: 1.1; }

.gate {
  position: relative; width: min(420px, 100%); text-align: center;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; padding: clamp(28px, 5vh, 44px) clamp(22px, 5vw, 40px);
  box-shadow: 0 24px 70px -32px rgba(22,32,43,.35);
}
.gate img { height: 46px; display: inline-block; }
.gate img.lg-d { display: none; }
@media (prefers-color-scheme: dark) {
  .gate img.lg-l { display: none; }
  .gate img.lg-d { display: inline-block; }
}
/* One color for the whole title, and it is the ink, not a purple: the brand
   user's call, candidate D from the comparison sheet: the secondary grey,
   sitting a step quieter than the ink labels so the logo stays the loudest
   mark on the card. Purple then does exactly two jobs here, the mark above
   and the button below, which is what lets the button read as the one thing
   to press. Sized to sit tightly under the logo, per review: small and only
   a notch heavier than the Enter Password label, so the card reads as one
   quiet block; nowrap holds one line down to a phone. */
h1 { font-size: clamp(14px, 3.6vw, 16px); font-weight: 580;
  letter-spacing: -.008em; margin-top: 16px; white-space: nowrap;
  color: var(--sub); }
/* One line under the title, quieter than it in both size and weight, so the
   card reads mark, then name, then welcome, then the one thing to do. */
.sub1 { font-size: 12px; font-weight: 400; color: var(--mute);
  line-height: 1.5; margin-top: 7px; max-width: 30ch;
  margin-inline: auto; text-wrap: balance; }
form { margin-top: 24px; text-align: left; }
/* The label lives INSIDE the field. A label stacked above it left the box
   looking like an empty rectangle with a caption; inset, the field is one
   object that says what it wants, and the box keeps its whole width for the
   thing being typed. The wrapper carries the border and the focus ring so
   the label, the input and the toggle move as one. */
.pwwrap {
  position: relative; display: flex; align-items: center; gap: 8px;
  padding: 7px 7px 8px 13px;
  border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--surface);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.pwwrap:hover { border-color: var(--sub); }
.pwwrap:focus-within { border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.pwfield { flex: 1 1 auto; min-width: 0; }
label { font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
  color: var(--mute); display: block; line-height: 1.35; }
input {
  font: inherit; font-size: 15px; width: 100%; padding: 1px 0 0;
  border: 0; background: none; color: var(--ink); letter-spacing: .04em;
}
input:focus { outline: none; }
/* The word "Show" named the action but sat in the field like a value. The
   eye is the convention, it costs no width, and its state is carried by
   aria-pressed and by the label rather than by the shape alone. */
.show {
  position: relative;
  flex: 0 0 auto; display: grid; place-items: center;
  width: 36px; height: 36px; border-radius: 9px;
  color: var(--mute); background: none; border: 0; cursor: pointer;
  transition: color .15s ease, background .15s ease;
}
/* The button is drawn at 36px so it sits inside the field without stretching
   it, and its TARGET is 44px, which is the size a thumb needs. Growing the
   drawn button instead would have pushed the field two pixels taller for no
   visual gain. */
.show::after { content: ""; position: absolute; inset: -4px; }
.show svg { width: 18px; height: 18px; }
.show:hover { color: var(--ink); background: var(--bg); }
/* One focus treatment per control. The wrapper's ring fires on focus-within,
   so tabbing to the eye lit the whole field as though the input had focus and
   left the button itself wearing the browser default. */
.show:focus-visible, button.go:focus-visible {
  outline: 2px solid var(--brand); outline-offset: 2px; }
.pwwrap:has(.show:focus-visible) {
  border-color: var(--line); box-shadow: none; }
.show .off { display: none; }
.show[aria-pressed="true"] .off { display: block; }
.show[aria-pressed="true"] .on { display: none; }
button.go {
  font: inherit; font-size: 14.5px; font-weight: 680; width: 100%;
  margin-top: 16px; padding: 13px; border: 0; border-radius: 999px;
  background: #7029EC; color: #fff; cursor: pointer;
  transition: filter .15s ease, transform .15s ease;
}
button.go:hover { filter: brightness(1.08); transform: translateY(-1px); }
button.go:active { transform: none; }
button.go[disabled] { opacity: .6; cursor: wait; transform: none; }
.err { font-size: 12.5px; color: var(--errc); margin-top: 10px;
  min-height: 16px; font-weight: 650; text-align: center; }
.meta {
  display: flex; gap: 7px; align-items: center; justify-content: center;
  margin-top: 10px; font-size: 11.5px; color: var(--mute);
}
.meta svg { width: 14px; height: 14px; flex: 0 0 14px; color: var(--brand); }
/* The gate says four things and stops: whose report this is, what it is,
   what to do, and that it is encrypted. What encryption does NOT do here -
   that it is protection at rest and not access control, that anyone with the
   password or an unlocked copy has the contents, that there is no reset - is
   a fact about the file rather than about the programme, and belongs in the
   handover note and in this source, not on a screen someone is trying to get
   past. It is stated in full in the header comment at the top of the built
   file, in this module's docstring, and in outputs/MHC_Disclosure_Control.md. */
.foot { position: fixed; left: 0; right: 0; bottom: 14px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 16px; font-size: 11px; color: var(--sub); white-space: nowrap; }
.foot .bar { opacity: .45; padding: 0 6px; }
/* One line is the intent, but three segments do not fit a phone at a legible
   size, so the narrow view stacks them centred rather than clipping the ends. */
@media (max-width: 620px) {
  .foot { flex-direction: column; gap: 3px; font-size: 10px; }
  .foot .bar { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .gate { animation: rise .5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); }
                    to { opacity: 1; transform: none; } }
}
</style>
</head>

   THE GATE
   ---------------------------------------------------------------------------
   Everything this file can do before the password is typed is in this one
   script. It is short on purpose: the less code that runs before the reader
   is authenticated, the less there is to get wrong.

           sent anywhere: there is no network call in this file at all.

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const pwEl = document.getElementById('pw');

/* STEP 2. Show and hide the password. The icon swaps in CSS off aria-pressed;
   the accessible name has to move with it, because an icon button with a
   fixed name announces the wrong action for half of its life. */
document.getElementById('show').addEventListener('click', e => {
  const b = e.currentTarget;
  const showing = pwEl.type === 'text';
  pwEl.type = showing ? 'password' : 'text';
  // The icon swaps in CSS off aria-pressed; the accessible name has to move
  // with it, because an icon button with a fixed name announces the wrong
  // action for half of its life.
  b.setAttribute('aria-pressed', String(!showing));
  const lab = showing ? 'Show the password' : 'Hide the password';
  b.setAttribute('aria-label', lab);
  b.title = lab;
  pwEl.focus();
});
/* Typing again clears the failed state: the error belongs to the attempt,
   not to the field. */
pwEl.addEventListener('input', () => pwEl.removeAttribute('aria-invalid'));

/* STEP 3. Derive, then decrypt. Both run in WebCrypto, on this machine. */
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  const pw = pwEl.value;
  if (!pw) return;
  go.disabled = true; go.textContent = 'Checking'; err.textContent = '';
  pwEl.removeAttribute('aria-invalid');
  try {
    /* 3a. The typed password becomes key material. Marked non-extractable,
       so nothing later in the page can read it back out. */
    const km = await crypto.subtle.importKey('raw',
      new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    /* 3b. Stretch it into a 256-bit AES key. This is the slow step, and the
       slowness is the point: it is the whole cost of a guess. */
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(V.salt), iterations: V.iter, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    /* 3c. Decrypt. GCM authenticates as well as decrypts, so a wrong password
       and a tampered file both land in the catch below rather than producing
       plausible-looking rubbish. */
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64(V.iv) }, key, b64(V.ct));
    /* STEP 4. Become the dashboard. document.write over the open document is
       deliberate: the decrypted HTML is a complete document with its own
       head, styles and scripts, and this hands the browser that document in
       this tab, with no navigation and no second file. Everything after this
       line is the dashboard's own code, which is commented where it lives:
       dashboard/hybrid/template.html, charts.js and app.js. */
    document.open(); document.write(new TextDecoder().decode(plain));
    document.close();
  } catch (_) {
    /* One message for both failure modes. Saying which of "wrong password"
       and "damaged file" it was would tell an attacker something and tells
       the reader nothing they can act on differently. */
    go.disabled = false; go.textContent = 'Open the Dashboard';
    err.textContent = 'That password did not open the file.';
    // The field itself carries the state, not only the sentence beside it.
    pwEl.setAttribute('aria-invalid', 'true');
    pwEl.select();
  }
});
